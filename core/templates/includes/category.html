<section class="py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h5 class="fw-bold mb-0">Explore by Category</h5>

        <a href="{% url 'business_list' %}" class="view-all-link">
            View All
        </a>

    </div>

    <div class="row g-3">

        {% for category in categories %}

        <div class="col-lg-2 col-md-3 col-4">

            <a href="{% url 'business_list' %}?category={{ category.slug }}"
               class="category-card">

               {% if category.icon %}
                    <img src="{{ category.icon.url }}"
                         alt="{{ category.name }}"
                         class="category-icon">
                {% endif %}

                <span>{{ category.name }}</span>

            </a>

        </div>

        {% endfor %}

    </div>

</section>
