{% if page_obj.paginator.num_pages > 1 %}

    <div class="business-pagination">

        {% if page_obj.has_previous %}

            <a href="?{{ pagination_query }}{% if pagination_query %}&{% endif %}page={{ page_obj.previous_page_number }}" class="pagination-button">
                Previous
            </a>

        {% endif %}


        {% for number in page_obj.paginator.page_range %}

            {% if number == page_obj.number %}

                <span class="pagination-button active">
                    {{ number }}
                </span>

            {% else %}

                <a
                    href="?{{ pagination_query }}{% if pagination_query %}&{% endif %}page={{ number }}"
                    class="pagination-button"
                >
                    {{ number }}
                </a>

            {% endif %}

        {% endfor %}


        {% if page_obj.has_next %}

            <a href="?{{ pagination_query }}{% if pagination_query %}&{% endif %}page={{ page_obj.next_page_number }}" class="pagination-button">
                Next
            </a>

        {% endif %}

    </div>

{% endif %}
