{% load static %}
<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %} {% endblock title %}</title>
	<link rel="stylesheet" type="text/css" href="{% static 'core/css/bootstrap.min.css' %}">
	<link rel="stylesheet" type="text/css" href="{% static 'core/css/owl.carousel.min.css' %}">
	<link rel="stylesheet" type="text/css" href="{% static 'core/css/owl.theme.default.min.css' %}">
	<link rel="stylesheet" type="text/css" href="{% static 'core/css/style.css' %}">
</head>

<div class="modal fade" id="businessModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header border-0 pb-0">
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <div id="modalContent">
                    Loading...
                </div>

            </div>

        </div>
    </div>
</div>

<body>

	{% include "includes/navbar.html" %}

	{% block hero %} {% endblock hero %}
	<div class="container">
		{% block content %}

		{% endblock content %}
	</div>

	{% include "includes/footer.html" %}

	<script src="{% static 'core/js/jquery.min.js' %}"></script>
	<script src="{% static 'core/js/owl.carousel.min.js' %}"></script>
	<script src="{% static 'core/js/bootstrap.min.js' %}"></script>
	<script src="{% static 'core/js/myscript.js' %}"></script>
</body>
</html>
