{% extends "core/base.html" %}

{% block title %} {{ page_title }} {% endblock title %}
{% block content %}

<div class="py-5">

    <h2 class="mb-4">{{ page_title }}</h2>

    {% for business in businesses %}

        <div class="card mb-3">
            <div class="card-body">

                <h5>{{ business.name }}</h5>

                <p>
                    {{ business.category }}
                    •
                    {{ business.area }}
                </p>

            </div>
        </div>

    {% empty %}

        <p>No businesses found.</p>

    {% endfor %}

</div>

{% endblock %}
